# pnpm 配置 —— @easbot/ui 单包组件库
#
# 注意：本仓库是**独立的单包组件库**，不是 monorepo —— 未声明 `packages:` 字段，
# 因此 pnpm 不会把任何子目录识别为 workspace 包。

# pnpm 8.10+ 在 deps drift 时会要求 TTY 确认以 purge modules dir；
# CI / 自动化环境无 TTY 时会 abort commit hook。
# 设为 false 跳过确认（CI 默认行为）。
confirmModulesPurge: false

# pnpm 11 在 Windows 默认 hardlink，常因防病毒/OneDrive 触发
# 误判为 deps drift 导致自动 purge。改用 copy 模式更稳。
packageImportMethod: copy

# 显式声明 nodeLinker，避免不同 pnpm 11.x 行为漂移
nodeLinker: isolated

# 不强制 24h 冷静期（开发效率优先）
minimumReleaseAgeStrict: false

# lockfile 与 package.json 不一致时拒绝 install 并要求 --no-frozen-lockfile
# 防止 pnpm 静默重算 lockfile
preferFrozenLockfile: true

# engines.node/pnpm 不匹配立即报错
engineStrict: true

# 团队统一 pnpm 版本（不自动切到 lockfile 里的旧 pnpm）
managePackageManagerVersions: false

# lockfile 稳定性：直接依赖取最低版本，间接依赖取最高
# 避免 pnpm 自行选择更高 minor 引起 lockfile 漂移
resolutionMode: lowest-direct

# 跑脚本（pnpm build/test）前自动 verify node_modules 完整性
# 默认 false：与"非手动不 install"诉求一致（手动 pnpm install 重建）
verifyDepsBeforeRun: false

# workspace 包互引走符号链接（当前为单包，无 workspace 互引，保留默认行为）
linkWorkspacePackages: true

# 需要执行构建脚本的依赖白名单
# - esbuild：tsup / vite 的打包内核
# - @tailwindcss/oxide：Tailwind v4 的 Rust 引擎
# - @biomejs/biome：Biome 二进制
onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@parcel/watcher'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - esbuild

# 显式允许 / 拒绝的构建脚本
# （原先此项含 'set this to true or false' 非法占位值，会导致 pnpm 解析失败）
allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: false

# 自 pnpm v10 起，overrides 必须放在 pnpm-workspace.yaml，package.json 里的 pnpm.overrides 会被忽略并触发 reinstall。
# 用 catalogs 统一管理依赖版本，overrides 引用 'catalog:default'。
catalogs:
  default:
    '@biomejs/biome': 2.5.5
    '@types/node': ^25.9.5
    esbuild: ^0.28.2
    typescript: ^6.0.3
    tsup: ^8.5.1

overrides:
  '@biomejs/biome': 'catalog:default'
  '@types/node': 'catalog:default'
  esbuild: 'catalog:default'
  typescript: 'catalog:default'
  tsup: 'catalog:default'

# 注：已通过 minimumReleaseAgeStrict: false 关闭 24h 冷静期
# 此白名单保留仅为紧急绕过特定版本发布审核（按需取消注释）
minimumReleaseAgeExclude:
  - lucide-react@1.65.0
